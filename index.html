<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LocalTunnel & Cloudflare Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>Tunnel</h1>
        <span class="badge">Manager</span>
      </div>
      <div class="header-actions">
        <button id="logs-btn" class="btn-icon" title="Открыть папку с логами">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <button id="theme-btn" class="btn-icon" title="Сменить тему">
          <svg id="theme-icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button id="add-btn" class="btn-primary-round" title="Добавить туннель">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <div id="add-form" class="add-form-card hidden">
      <h3 id="form-title">Новый туннель</h3>
      <div class="form-grid-modern">
        <div class="form-group">
          <label for="name-input">Название проекта / конфигурации</label>
          <input type="text" id="name-input" placeholder="например, Мой сайт, Тестовый API">
        </div>
        <div class="form-row-2col">
          <div class="form-group">
            <label for="provider-select">Провайдер туннеля</label>
            <select id="provider-select" class="form-select">
              <option value="lt">LocalTunnel (LT)</option>
              <option value="cf">Cloudflare (CF)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="port-input">Локальный порт</label>
            <input type="number" id="port-input" placeholder="например, 3000" min="1" max="65535">
          </div>
        </div>
        <div id="subdomain-group" class="form-group">
          <label for="subdomain-input">Субдомен (опционально)</label>
          <input type="text" id="subdomain-input" placeholder="например, my-app">
        </div>
      </div>
      <div class="form-actions">
        <button id="cancel-btn" class="btn-secondary">Отмена</button>
        <button id="save-btn" class="btn-success">Создать туннель</button>
      </div>
    </div>

    <div class="filters-container">
      <div class="filters-row">
        <div class="filter-group">
          <label for="filter-status">Статус:</label>
          <select id="filter-status" class="filter-select">
            <option value="all">Все</option>
            <option value="active">Активен</option>
            <option value="warning">Локальный порт недоступен</option>
            <option value="inactive">Не активен</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-provider">Провайдер:</label>
          <select id="filter-provider" class="filter-select">
            <option value="all">Все</option>
            <option value="lt">LocalTunnel</option>
            <option value="cf">Cloudflare</option>
          </select>
        </div>
        <button id="reset-filters" class="btn-reset" title="Сбросить все фильтры">Сбросить</button>
      </div>
    </div>

    <main id="tunnels-list" class="tunnels-list"></main>

    <div id="batch-bar" class="batch-bar">
      <div class="batch-bar-content">
        <div class="batch-bar-left">
          <button id="batch-select-all" class="btn-batch-link">Выбрать все</button>
          <span id="selected-count">Выбрано: 0</span>
        </div>
        <div class="batch-actions-buttons">
          <button id="batch-start-btn" class="btn-batch btn-batch-success" title="Включить выбранные">Вкл</button>
          <button id="batch-stop-btn" class="btn-batch btn-batch-warning" title="Выключить выбранные">Выкл</button>
          <button id="batch-delete-btn" class="btn-batch btn-batch-danger" title="Удалить выбранные">Удалить</button>
          <button id="batch-cancel-btn" class="btn-batch btn-batch-secondary" title="Сбросить выбор">Сбросить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
