<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LocalTunnel Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>LocalTunnel</h1>
        <span class="badge">Manager</span>
      </div>
      <button id="add-btn" class="btn-primary-round" title="Добавить туннель">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </header>

    <div id="add-form" class="add-form-card hidden">
      <h3 id="form-title">Новый туннель</h3>
      <div class="form-grid-modern">
        <div class="form-group">
          <label for="name-input">Название проекта / конфигурации</label>
          <input type="text" id="name-input" placeholder="например, Мой сайт, Тестовый API">
        </div>
        <div class="form-row-2col">
          <div class="form-group">
            <label for="port-input">Локальный порт</label>
            <input type="number" id="port-input" placeholder="например, 3000" min="1" max="65535">
          </div>
          <div class="form-group">
            <label for="subdomain-input">Субдомен (опционально)</label>
            <input type="text" id="subdomain-input" placeholder="например, my-app">
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button id="cancel-btn" class="btn-secondary">Отмена</button>
        <button id="save-btn" class="btn-success">Создать туннель</button>
      </div>
    </div>

    <main id="tunnels-list" class="tunnels-list"></main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
